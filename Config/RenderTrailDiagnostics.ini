[RenderTrailDiagnostics]
; Structured replay/analysis diagnostics and the complete focused-query journal are
; enabled by default. Full payload mode is an opt-in developer audit mode because it
; serializes long shader step streams and modification tails that are not needed to
; reconstruct the selected causal chain.
; Stable stage records include worker_request_*, event_context_*, shader_debug_*,
; trace_schedule_*, trace_branch_*, background_trace_*, and agent_*.
; GPU crash diagnostics create unique Worker/RenderDoc logs and OS snapshots. Enable
; them only while investigating device-lost failures; they are unrelated to tracing.
bEnabled=true
bWorkerProtocol=true
bAgentTraffic=true
bFullEvidencePayload=false
bGpuCrashDiagnostics=false
; Uses RenderDoc's Fastest replay policy. For D3D12 this avoids diagnostic
; fills of discarded/undefined contents while preserving valid API replay,
; Pixel History and Shader Debug. Set false for a Balanced A/B comparison.
bFastReplay=true
; Enables D3D12 DRED only inside the isolated Worker process. The value is not
; persisted to RenderDoc's global configuration. Keep this off for normal
; causal replay; enable it only while reproducing a device-lost failure.
bRenderDocDRED=false
