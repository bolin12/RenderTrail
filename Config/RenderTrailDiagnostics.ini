[RenderTrailDiagnostics]
; Full replay/analysis diagnostics are enabled by default for development builds.
; Override these values in Project/Config/RenderTrailDiagnostics.ini when distributing.
; Stable stage records include worker_request_*, event_context_*, shader_debug_*,
; trace_schedule_*, trace_branch_*, background_trace_*, and agent_*.
bEnabled=true
bWorkerProtocol=true
bAgentTraffic=true
bFullEvidencePayload=true
